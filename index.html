<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/icon.png" />
  <title>RAT-TRACK</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=105" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="RODENT APP LOGO.jpg" class="logo-img" alt="RAT-TRACK logo" />
      <span class="brand-name">RAT-TRACK</span>
    </div>
    <div class="topbar-right">
      <button class="notif-bell" id="notif-bell" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
      <div class="sync">
        <span id="sync-dot" class="dot" title="Sync status"></span>
        <span id="sync-text" class="sync-text">Local only</span>
      </div>
    </div>
  </header>

  <!-- Notification panel -->
  <div id="notif-panel" class="notif-panel" hidden>
    <div class="notif-panel-head">
      <span class="notif-panel-title">Notifications</span>
      <button class="icon-btn" id="notif-close" aria-label="Close">✕</button>
    </div>
    <div id="notif-list" class="notif-list"></div>
  </div>
  <div id="notif-backdrop" class="notif-backdrop" hidden></div>

  <div id="pending-banner" class="pending-banner" hidden>
    <span id="pending-banner-text"></span>
    <button class="pending-sync-btn" data-act="upload-changes">Upload changes</button>
  </div>

  <div class="tabs-wrap">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="dashboard" role="tab">Dashboard</button>
      <button class="tab" data-tab="trays" role="tab">Trays</button>
      <button class="tab" data-tab="charts" role="tab">Charts</button>
      <button class="tab" data-tab="reports" role="tab">Reports</button>
      <button class="tab tab-more" id="tab-more-btn" role="button" aria-haspopup="true">More ···</button>
    </nav>
  </div>

  <main id="app">
    <section id="tab-dashboard" class="panel active"></section>
    <section id="tab-trays" class="panel"></section>
    <section id="tab-charts" class="panel"></section>
    <section id="tab-freezer" class="panel"></section>
    <section id="tab-calendar" class="panel"></section>
    <section id="tab-maturity" class="panel"></section>
    <section id="tab-species" class="panel"></section>
    <section id="tab-settings" class="panel"></section>
    <section id="tab-reports" class="panel"></section>
  </main>

  <!-- Modal host -->
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Title</h3>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- More sheet (H-02) -->
  <div id="more-sheet" class="more-sheet" hidden>
    <div class="more-sheet-backdrop" id="more-sheet-bd"></div>
    <div class="more-sheet-body">
      <div class="more-sheet-handle"></div>
      <p class="more-sheet-label">More sections</p>
      <div class="more-sheet-grid">
        <button class="more-item" data-tab="freezer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h20M12 2v20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/>
          </svg>
          <span>Freezer</span>
        </button>
        <button class="more-item" data-tab="calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          <span>Calendar</span>
        </button>
        <button class="more-item" data-tab="maturity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span>Maturity</span>
        </button>
        <button class="more-item" data-tab="species">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/>
          </svg>
          <span>Species</span>
        </button>
        <button class="more-item" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=105"></script>
</body>
</html>
