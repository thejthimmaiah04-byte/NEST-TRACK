<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>RAT-TRACK</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=102" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="RODENT APP LOGO.jpg" class="logo-img" alt="RAT-TRACK logo" />
      <span class="brand-name">RAT-TRACK</span>
    </div>
    <div class="topbar-right">
      <button class="notif-bell" id="notif-bell" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
      <div class="sync">
        <span id="sync-dot" class="dot" title="Sync status"></span>
        <span id="sync-text" class="sync-text">Local only</span>
      </div>
    </div>
  </header>

  <!-- Notification panel -->
  <div id="notif-panel" class="notif-panel" hidden>
    <div class="notif-panel-head">
      <span class="notif-panel-title">Notifications</span>
      <button class="icon-btn" id="notif-close" aria-label="Close">✕</button>
    </div>
    <div id="notif-list" class="notif-list"></div>
  </div>
  <div id="notif-backdrop" class="notif-backdrop" hidden></div>

  <div id="pending-banner" class="pending-banner" hidden>
    <span id="pending-banner-text"></span>
    <button class="pending-sync-btn" data-act="upload-changes">Upload changes</button>
  </div>

  <div class="tabs-wrap">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="dashboard" role="tab">Dashboard</button>
      <button class="tab" data-tab="trays" role="tab">Trays</button>
      <button class="tab" data-tab="charts" role="tab">Charts</button>
      <button class="tab" data-tab="freezer" role="tab">Freezer</button>
      <button class="tab" data-tab="calendar" role="tab">Calendar</button>
      <button class="tab" data-tab="maturity" role="tab">Maturity</button>
      <button class="tab" data-tab="species" role="tab">Species</button>
      <button class="tab" data-tab="reports" role="tab">Reports</button>
      <button class="tab" data-tab="settings" role="tab">Settings</button>
    </nav>
  </div>

  <main id="app">
    <section id="tab-dashboard" class="panel active"></section>
    <section id="tab-trays" class="panel"></section>
    <section id="tab-charts" class="panel"></section>
    <section id="tab-freezer" class="panel"></section>
    <section id="tab-calendar" class="panel"></section>
    <section id="tab-maturity" class="panel"></section>
    <section id="tab-species" class="panel"></section>
    <section id="tab-settings" class="panel"></section>
    <section id="tab-reports" class="panel"></section>
  </main>

  <!-- Modal host -->
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Title</h3>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js?v=102"></script>
</body>
</html>
